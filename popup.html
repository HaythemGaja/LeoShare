<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoShare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 320px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f1f5f9; padding: 18px; }
  h1 { font-size: 20px; margin-bottom: 2px; }
  h1 span { color: #38bdf8; }
  p.sub { font-size: 12px; color: #94a3b8; margin-bottom: 14px; line-height: 1.5; }
  .code-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 12px; }
  .code-box label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; display: block; margin-bottom: 6px; }
  #myCode { font-size: 22px; font-weight: 800; letter-spacing: .12em; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; border: 0; border-radius: 9px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #openBtn { background: #0284c7; color: #fff; }
  #openBtn:hover { background: #0369a1; }
  #copyBtn { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; flex: 0 0 86px; }
  #copyBtn:hover { background: #334155; }
  .note { font-size: 11px; color: #64748b; margin-top: 12px; line-height: 1.5; text-align: center; }
  #status { font-size: 12px; color: #38bdf8; text-align: center; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <h1>Leo<span>Share</span></h1>
  <p class="sub">Send files straight to another browser. No email, no Drive, nothing uploaded anywhere.</p>
  <div class="code-box">
    <label>Your device code</label>
    <div id="myCode">…</div>
  </div>
  <div class="row">
    <button id="openBtn">Open LeoShare</button>
    <button id="copyBtn">Copy code</button>
  </div>
  <div id="status"></div>
  <div id="counts" style="font-size:12px;color:#94a3b8;text-align:center;margin-top:4px;min-height:16px"></div>
  <p class="note">Install this extension on both devices.<br>Enter the other device's code to connect, then send.</p>
  <script src="popup.js"></script>
</body>
</html>
